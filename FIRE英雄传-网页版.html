function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return Number(v||0).toLocaleString('zh-CN',{maximumFractionDigits:0})}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function route(name){app.route=name;app.curve.phase=name==='curve'&&app.curve.phase==='result'?'result':'entry';persist();render()}
function currentStage(age){return Number(age)<18?'youth':Number(age)<40?'young':Number(age)<60?'middle':'later'}
function stageName(v){return {youth:'成长阶段',young:'青年阶段',middle:'家庭阶段',later:'后期规划',event:'人生事件'}[v]||v}
function visibleQuestions(){const age=Number(app.curve.age);const stage=currentStage(age);const list=QUESTIONS.filter(q=>q.id!=='q100'&&q.stage===stage).slice(0,49);const event=QUESTIONS.find(q=>q.id==='q100');return event?list.concat(event):list}
function unit(q){if(!q)return '';if(q.type==='ratio'||q.type==='percent')return '%';if(q.type==='years')return '年';if(q.type==='retirement_age')return '岁';return '元'}
function formatAnswer(q,v){const n=Number(v);return Number.isFinite(n)?money(n)+' '+unit(q):String(v)}
function getByText(match,fallback){const list=visibleQuestions();const q=list.find(x=>match(x.text));return q&&app.curve.answers[q.id]!==undefined?Number(app.curve.answers[q.id]):fallback}
function chartRows(){const r=app.curve.result;return r&&r.rows?r.rows:[]}
function calculate(){const age=Number(app.curve.age),life=Number(app.curve.life),years=Math.max(1,life-age);const val=(type,fallback)=>{const q=visibleQuestions().find(x=>x.type===type&&app.curve.answers[x.id]!==undefined)||visibleQuestions().find(x=>x.type===type);return q&&app.curve.answers[q.id]!==undefined?Number(app.curve.answers[q.id]):fallback};const start=val('balance',0),income=val('income_monthly',8000),saveRate=val('ratio',30)/100,baseExpense=val('expense_monthly',3000);const growth=getByText(t=>t.indexOf('收入增长率')>=0||t.indexOf('工资每年固定增长')>=0,3.5)/100;const inflation=getByText(t=>t.indexOf('通货膨胀率')>=0||t.indexOf('生活成本每年增长率')>=0,2.5)/100;const returnRate=getByText(t=>t.indexOf('复利年化收益率')>=0,3.5)/100;const retirementAge=getByText(t=>t.indexOf('预计在多少岁退休')>=0||t.indexOf('退休时年龄')>=0,life+1);const cutoff=Math.min(getByText(t=>t.indexOf('收入预计在多少岁中断')>=0||t.indexOf('停止工作')>=0,retirementAge),retirementAge);const retirementIncome=getByText(t=>t.indexOf('退休后每月')>=0&&t.indexOf('稳定收入')>=0,0);const planned=[];const add=(tm,am,label)=>{const y=getByText(tm,0),a=getByText(am,0);if(y>0&&a>0)planned.push({age:age+y,amount:-a,label:label})};add(t=>t.indexOf('攒够首付')>=0,t=>t.indexOf('买房的首付')>=0,'买房');add(t=>t.indexOf('还清车贷')>=0,t=>t.indexOf('买车的预算')>=0,'买车');const marriage=getByText(t=>t.indexOf('结婚的一次性')>=0,0)+getByText(t=>t.indexOf('彩礼金额')>=0,0)+getByText(t=>t.indexOf('婚礼酒席')>=0,0);if(marriage>0)planned.push({age:age+2,amount:-marriage,label:'结婚'});const edu=getByText(t=>t.indexOf('子女教育金目标')>=0,0);if(edu>0)planned.push({age:age+5,amount:-edu,label:'教育金'});const custom=getByText(t=>t.indexOf('自定义人生事件')>=0,0);if(custom)planned.push({age:age+1,amount:custom,label:'自定义'});let b=start,rows=[{age:age,balance:Math.round(b)}];for(let i=1;i<=years;i++){const a=age+i;const eventTotal=app.curve.events.filter(e=>Number(e.age)===a).reduce((s,e)=>s+Number(e.amount||0),0)+planned.filter(e=>e.age===a).reduce((s,e)=>s+e.amount,0);const active=a>=cutoff?retirementIncome:income*Math.pow(1+growth,i-1);const expense=(baseExpense*12)*Math.pow(1+inflation,i-1);b=b*(1+returnRate)+active*12*saveRate-expense+eventTotal;rows.push({age:a,balance:Math.round(b)})}return {rows,peak:Math.max(...rows.map(x=>x.balance)),min:Math.min(...rows.map(x=>x.balance)),retirement:rows[rows.length-1].balance,planned:planned}}
function curveSegments(rows){if(!rows.length)return[];const max=Math.max(1,...rows.map(x=>x.balance)),min=Math.min(0,...rows.map(x=>x.balance)),range=max-min;const p=(r,i)=>({x:28+i*322/Math.max(1,rows.length-1),y:158-(r.balance-min)/range*120});const groups=[];let g={neg:rows[0].balance<0,pts:[p(rows[0],0)]};rows.slice(1).forEach((r,i)=>{const idx=i+1,neg=r.balance<0,pt=p(r,idx);if(neg!==g.neg){g.pts.push(p(rows[idx-1],idx-1));groups.push(g);g={neg:neg,pts:[p(rows[idx-1],idx-1),pt]}}else g.pts.push(pt)});groups.push(g);return groups.map((g,i)=>{const pts=g.pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');const first=g.pts[0],last=g.pts[g.pts.length-1];return {key:i,neg:g.neg,points:pts,area:g.pts.length>1?pts+' '+last.x.toFixed(1)+',158 '+first.x.toFixed(1)+',158':''}})}
function summaryItems(){const qs=visibleQuestions().filter(q=>app.curve.answers[q.id]!==undefined);const key=qs.filter(q=>/退休|收入中断|停止工作|稳定收入/.test(q.text));const list=[];qs.slice(0,6).concat(key).forEach(q=>{if(!list.some(x=>x.id===q.id))list.push(q)});return list.slice(0,12)}

function renderCurve(){const c=app.curve;if(c.phase==='entry')return pageShell('普通人一生存款曲线','用年龄、收入、支出和人生事件，看见钱会怎样走。','<div class="card entry"><h2>看见钱会怎样走</h2><p class="sub">正式题目会根据你的年龄自动筛选，结果根据范围估算。</p><button class="primary full" data-action="curve-new">开始新的计算</button><button data-action="curve-draft">查看我的草稿</button><button data-action="curve-history">查看我的历史结果</button></div>');if(c.phase==='setup')return pageShell('普通人一生存款曲线','先填写两个数字。','<div class="card"><div class="field"><label>当前年龄</label><input data-model="curve.age" type="number" value="'+esc(c.age)+'" placeholder="请输入你的当前年龄"></div><div class="field"><label>预计寿命</label><input data-model="curve.life" type="number" value="'+esc(c.life)+'" placeholder="请输入你的预计寿命"></div><button class="primary full" data-action="curve-begin">进入第 1 题</button></div>');if(c.phase==='drafts')return pageShell('我的草稿','继续上次停留的位置。','<div class="card">'+(c.draft?<div class="list-row"><b>草稿 · 已完成 '+Object.keys(c.draft.answers||{}).length+' 题</b><small>上次停留第 '+(Number(c.draft.index||0)+1)+' 题 · '+new Date(c.draft.updatedAt).toLocaleString('zh-CN')+'</small><button class="primary full" data-action="curve-resume">继续答题</button><button class="outline full" data-action="curve-delete-draft">删除草稿</button></div>:'<p class="sub">暂无草稿</p>')+'<button class="secondary full" data-action="curve-back-entry">返回</button></div>');if(c.phase==='history')return pageShell('历史结果','只显示真实完成过的测算。','<div class="card">'+(c.history&&c.history.length?c.history.map((h,i)=>'<div class="list-row"><b>第 '+(i+1)+' 次测算 · '+h.age+' 岁</b><small>'+new Date(h.updatedAt).toLocaleString('zh-CN')+' · 退休时 ¥'+money(h.retirement)+'</small><button class="outline" data-action="curve-view-history" data-index="'+i+'">查看详情</button><button class="outline" data-action="curve-delete-history" data-index="'+i+'">删除</button></div>').join(''):'<p class="sub">暂无历史结果</p>')+'<button class="secondary full" data-action="curve-back-entry">返回</button></div>');if(c.phase==='loading')return pageShell('正在生成','请稍候 5 秒。','<div class="loading"><div class="spinner"></div><b>正在整理你的人生计划…</b><p class="sub">沿着年龄线计算每个重要节点</p></div>');if(c.phase==='quiz'){const qs=visibleQuestions(),q=qs[c.index],opts=q.options||[];return pageShell('普通人一生存款曲线','第 '+(c.index+1)+' / '+qs.length+' 题','<div class="progress-row"><span>'+stageName(q.stage)+'</span><span>'+Math.round((c.index+1)/qs.length*100)+'%</span></div><div class="question"><span class="tag">'+stageName(q.stage)+'</span><h2>'+q.text+'</h2>'+opts.map((o,i)=>'<div class="option '+(c.customAnswers[q.id]===undefined&&c.answers[q.id]===o.value?'selected':'')+'" data-action="curve-answer" data-value="'+o.value+'"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o.label+'</div>').join('')+'<div class="option '+(c.customAnswers[q.id]!==undefined?'selected':'')+'" data-action="curve-custom"><span class="letter">F</span>自定义</div>'+(c.customEditing===q.id?'<div class="custom-row"><input data-model="curve.customDraft" type="number" value="'+esc(c.customDraft)+'" placeholder="请输入数值"><span>'+unit(q)+'</span><button data-action="curve-confirm-custom">确定</button></div>':'')+'</div><div class="nav"><button class="secondary" data-action="curve-prev">上一题</button><button class="secondary" data-action="curve-save">保存到我的草稿</button><button class="primary" data-action="curve-next">'+(c.index===qs.length-1?'生成结果':'下一题')+'</button></div>')}return renderCurveResult()}
function renderCurveResult(){const c=app.curve,r=c.result,rows=r.rows,groups=curveSegments(rows),max=Math.max(...rows.map(x=>x.balance)),min=Math.min(...rows.map(x=>x.balance));const svg='<svg viewBox="0 0 360 230"><line x1="28" y1="158" x2="350" y2="158" class="baseline"></line><line x1="28" y1="38" x2="350" y2="38" class="grid-line"></line><line x1="28" y1="78" x2="350" y2="78" class="grid-line"></line><line x1="28" y1="118" x2="350" y2="118" class="grid-line"></line>'+groups.map(g=>'<polygon points="'+g.area+'" class="'+(g.neg?'area-negative':'area-positive')+'"></polygon><polyline points="'+g.points+'" class="curve '+(g.neg?'negative':'')+'"></polyline>').join('')+'<text x="26" y="40" class="axis-label">'+money(max)+'</text><text x="24" y="162" class="axis-label">0</text><text x="26" y="198" class="axis-label">'+money(min)+'</text></svg>';const summary=summaryItems().map(q=>{const option=(q.options||[]).find(o=>o.value===c.answers[q.id]);const label=option?option.label:formatAnswer(q,c.answers[q.id]);return '<div class="summary-row"><span>'+q.text+'</span><strong>'+label+'</strong></div>}).join('');const ev=c.events.map((e,i)=>'<div class="event-row"><input data-model="curve.events.'+i+'.label" value="'+esc(e.label)+'" placeholder="事件"><input data-model="curve.events.'+i+'.age" type="number" value="'+esc(e.age)+'" placeholder="年龄"><input data-model="curve.events.'+i+'.amount" type="number" value="'+esc(e.amount)+'" placeholder="金额"><button data-action="curve-remove-event" data-index="'+i+'">×</button></div>').join('');return pageShell('你的存款曲线','从 '+c.age+' 岁推算到 '+c.life+' 岁','<div class="summary"><div class="section-title">本次答案摘要</div>'+summary+'</div><div class="result-chart"><div class="total">¥'+money(r.retirement)+'</div><span class="age">'+c.life+' 岁</span><span class="chart-caption">存款 · 人生曲线</span>'+svg+'<div class="chart-labels"><span>'+c.age+' 岁</span><span>'+Math.round((Number(c.age)+Number(c.life))/2)+' 岁</span><span>'+c.life+' 岁</span></div></div><div class="metric-grid"><div class="metric"><small>预计峰值</small><strong>¥'+money(r.peak)+'</strong></div><div class="metric"><small>最低余额</small><strong>¥'+money(r.min)+'</strong></div><div class="metric"><small>退休时</small><strong>¥'+money(r.retirement)+'</strong></div></div><div class="event-card"><div class="section-head"><div class="section-title">自定义人生事件</div><span class="sub">'+c.events.length+'/5</span></div>'+ev+(c.events.length<5?'<button class="outline full" data-action="curve-add-event">＋ 添加事件</button>':'')+'<span class="sub">正数表示收入，负数表示支出。</span></div><button class="primary full" data-action="curve-recalc">重新计算</button><div class="notice">本结果根据你选择的范围估算，不代表确定结果。</div><div class="card"><div class="section-head"><div class="section-title">AI 解析</div><span class="sub">不超过 300 字</span></div>'+(c.ai?'<p>'+esc(c.ai)+'</p>':'')+'<button class="secondary full" data-action="curve-ai">'+(c.ai?'重新获取 AI 解析':'获取 AI 解析')+'</button></div>')}

function render(){document.body.classList.toggle('dark',app.theme==='dark');let out='';if(app.route==='launch')out=renderLaunch();else if(app.route==='login')out=renderLogin(false);else if(app.route==='register')out=renderLogin(true);else if(app.route==='home')out=renderHome();else if(app.route==='tools')out=renderTools();else if(app.route==='calculator')out=renderCalculator();else if(app.route==='ledger')out=renderLedger();else if(app.route==='wishlist')out=renderWishlist();else if(app.route==='community')out=renderCommunity();else if(app.route==='reading')out=renderReading();else if(app.route==='hero')out=renderHero();else if(app.route==='ai')out=renderAI();else if(app.route==='music')out=renderMusic();else if(app.route==='profile')out=renderProfile();else if(app.route==='settings')out=renderSettings();else if(app.route==='curve')out=renderCurve();document.getElementById('view').innerHTML=out;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.route===app.route));document.getElementById('quick').classList.remove('open');persist()}
function setPath(path,value){const parts=path.split('.');let obj=app;for(let i=0;i<parts.length-1;i++){if(!obj[parts[i]])obj[parts[i]]={};obj=obj[parts[i]]}obj[parts[parts.length-1]]=value}
document.addEventListener('input',e=>{const m=e.target.dataset.model;if(!m)return;setPath(m,e.target.value);persist()});
document.addEventListener('change',e=>{const m=e.target.dataset.model;if(m){setPath(m,e.target.value);persist()}});
document.addEventListener('click',e=>{const routeEl=e.target.closest('[data-route]');if(routeEl){route(routeEl.dataset.route);return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='quick'){document.getElementById('quick').classList.toggle('open');return}
if(a==='enter'||a==='guest'){app.loggedIn=true;app.route='home';persist();render();return}
if(a==='to-login'){app.route='login';render();return}if(a==='to-register'){app.route='register';render();return}
if(a==='login-submit'||a==='register-submit'){app.loggedIn=true;app.profile.name=(document.getElementById('authEmail').value||'自由的旅人').split('@')[0];app.route='home';persist();render();toast(a==='login-submit'?'登录成功':'注册成功');return}
if(a==='logout'){app.loggedIn=false;app.route='launch';persist();render();return}
if(a==='theme-switch'){app.theme=app.theme==='dark'?'light':'dark';persist();render();return}
if(a==='save-finance'){app.finance.assets=Number(document.querySelector('[data-model="finance.assets"]').value||0);app.finance.income=Number(document.querySelector('[data-model="finance.income"]').value||0);app.finance.expense=Number(document.querySelector('[data-model="finance.expense"]').value||0);persist();render();toast('财务数据已保存');return}
if(a==='task'||a==='hero-task'){const i=Number(el.dataset.index);if(e.target.checked){if(app.completed.indexOf(i)<0)app.completed.push(i)}else app.completed=app.completed.filter(x=>x!==i);persist();return}
if(a==='ledger-save'){const amount=Number(document.getElementById('ledgerAmount').value||0);if(!amount){toast('请输入金额');return}const kind=(document.querySelector('[data-kind].active')||{dataset:{kind:'expense'}}).dataset.kind;app.ledger.unshift({amount:amount,kind:kind,note:document.getElementById('ledgerNote').value,date:Date.now()});persist();render();toast('记录已保存');return}
if(a==='ledger-delete'){app.ledger.splice(Number(el.dataset.index),1);persist();render();return}
if(a==='wish-add'){const name=document.getElementById('wishName').value.trim();const amount=Number(document.getElementById('wishAmount').value||0);if(!name||!amount){toast('请填写名称和金额');return}app.wishlist.unshift({name:name,amount:amount,days:Number(document.getElementById('wishDays').value),status:'冷静中'});persist();render();toast('已加入冷静期');return}
if(a==='wish-status'){app.wishlist[Number(el.dataset.index)].status='已购买';persist();render();return}
if(a==='wish-delete'){app.wishlist.splice(Number(el.dataset.index),1);persist();render();return}
if(a==='community-tab'){app.communityTab=el.dataset.tab;render();return}
if(a==='community-fav'){const id=Number(el.dataset.id);app.favorites=app.favorites.indexOf(id)>=0?app.favorites.filter(x=>x!==id):app.favorites.concat(id);persist();render();return}
if(a==='community-expand'){const p=document.getElementById('post-'+el.dataset.id);if(p)p.style.display=p.style.display==='none'?'block':'none';return}
if(a==='community-share'){toast('分享入口已准备，可继续接入云端发布');return}
if(a==='book-progress'){const b=app.books[Number(el.dataset.index)];b.progress=Math.min(100,b.progress+10);persist();render();return}
if(a==='music-play'){toast('播放已切换');return}
if(a==='profile-edit'){const n=prompt('请输入昵称',app.profile.name);if(n){app.profile.name=n;persist();render()}return}
if(a==='export'){const blob=new Blob([JSON.stringify(app,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='green-island-data.json';link.click();URL.revokeObjectURL(url);return}
if(a==='clear-data'){if(confirm('确定清除本机数据吗？')){localStorage.removeItem(KEY);location.reload()}return}
if(a==='curve-new'){app.curve={phase:'setup',age:'',life:'',index:0,answers:{},customAnswers:{},customEditing:'',customDraft:'',events:[],result:null,ai:'',draft:null,history:JSON.parse(localStorage.getItem('green_curve_history')||'[]')};render();return}
if(a==='curve-begin'){const age=Number(app.curve.age),life=Number(app.curve.life);if(!age||age<8||age>90||!life||life<=age||life>110){toast('请输入正确的当前年龄和预计寿命');return}app.curve.phase='quiz';app.curve.index=0;persist();render();return}
if(a==='curve-answer'){const q=visibleQuestions()[app.curve.index];app.curve.answers[q.id]=Number(el.dataset.value);delete app.curve.customAnswers[q.id];app.curve.customEditing='';app.curve.customDraft='';persist();render();return}
if(a==='curve-custom'){const q=visibleQuestions()[app.curve.index];app.curve.customEditing=q.id;app.curve.customDraft=app.curve.customAnswers[q.id]===undefined?'':String(app.curve.customAnswers[q.id]);render();return}
if(a==='curve-confirm-custom'){const q=visibleQuestions()[app.curve.index],v=Number(app.curve.customDraft);if(!Number.isFinite(v)){toast('请输入有效数字');return}if((q.type==='ratio'||q.type==='percent')&&(v<0||v>100)){toast('百分比需在 0 到 100 之间');return}app.curve.answers[q.id]=v;app.curve.customAnswers[q.id]=v;app.curve.customEditing='';app.curve.customDraft='';persist();render();return}
if(a==='curve-prev'){app.curve.index=Math.max(0,app.curve.index-1);persist();render();return}
if(a==='curve-save'){app.curve.draft={...app.curve,index:app.curve.index,updatedAt:Date.now()};localStorage.setItem('green_curve_draft',JSON.stringify(app.curve.draft));toast('草稿已保存');return}
if(a==='curve-draft'){const d=JSON.parse(localStorage.getItem('green_curve_draft')||'null');app.curve.draft=d;app.curve.phase='drafts';app.curve.history=JSON.parse(localStorage.getItem('green_curve_history')||'[]');render();return}
if(a==='curve-resume'){if(app.curve.draft){app.curve=app.curve.draft;app.curve.phase='quiz';persist();render()}return}
if(a==='curve-delete-draft'){localStorage.removeItem('green_curve_draft');app.curve.draft=null;render();return}
if(a==='curve-history'){app.curve.history=JSON.parse(localStorage.getItem('green_curve_history')||'[]');app.curve.phase='history';render();return}
if(a==='curve-view-history'){const h=app.curve.history[Number(el.dataset.index)];if(h){app.curve=h;app.curve.phase='result';persist();render()}return}
if(a==='curve-delete-history'){app.curve.history.splice(Number(el.dataset.index),1);localStorage.setItem('green_curve_history',JSON.stringify(app.curve.history));render();return}
if(a==='curve-back-entry'){app.curve.phase='entry';render();return}
if(a==='curve-next'){const q=visibleQuestions()[app.curve.index];if(app.curve.answers[q.id]===undefined&&q.required!==false){toast('请先选择一个答案');return}if(app.curve.index<visibleQuestions().length-1){app.curve.index++;persist();render();return}app.curve.phase='loading';render();setTimeout(()=>{app.curve.result=calculate();app.curve.phase='result';app.curve.history=JSON.parse(localStorage.getItem('green_curve_history')||'[]');app.curve.history.push({age:app.curve.age,life:app.curve.life,answers:app.curve.answers,customAnswers:app.curve.customAnswers,events:app.curve.events,result:app.curve.result,updatedAt:Date.now()});app.curve.history=app.curve.history.slice(-10);localStorage.setItem('green_curve_history',JSON.stringify(app.curve.history));localStorage.removeItem('green_curve_draft');persist();render()},5000);return}
if(a==='curve-add-event'){if(app.curve.events.length<5){app.curve.events.push({label:'买房',age:Number(app.curve.age)+5,amount:-100000});persist();render()}return}
if(a==='curve-remove-event'){app.curve.events.splice(Number(el.dataset.index),1);persist();render();return}
if(a==='curve-recalc'){app.curve.phase='loading';render();setTimeout(()=>{app.curve.result=calculate();app.curve.phase='result';persist();render()},800);return}
if(a==='curve-ai'){app.curve.ai='你的当前存款约为 ¥'+money(app.curve.result.rows[0].balance)+'，退休时约为 ¥'+money(app.curve.result.retirement)+'。建议优先建立应急金，并把买房、买车和收入中断情景单独预留预算。结果用于规划参考，不代表确定结果。';persist();render();return}
});

render();
