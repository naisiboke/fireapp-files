<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire生活后台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#173d35;background:#f4f7f2}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:24px;font-weight:800}.muted{color:#71807a;font-size:13px}.top-actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#173d35;color:white;cursor:pointer}.btn.light{background:#e4eee3;color:#315f4a}.btn.danger{background:#fff0eb;color:#a35d4e}.layout{display:grid;grid-template-columns:190px 1fr;gap:18px}.nav,.panel,.login{background:#fff;border:1px solid #e0e9df;border-radius:16px}.nav{padding:8px;height:max-content}.nav button{display:block;width:100%;padding:12px;border:0;border-radius:9px;text-align:left;background:transparent;color:#527059;cursor:pointer}.nav button.active{background:#e4eee3;color:#173d35;font-weight:700}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title{font-size:19px;font-weight:700}.search{width:240px;border:1px solid #dce7dc;border-radius:9px;padding:9px 11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border-radius:12px;background:#f4f8f2}.stat-label{color:#71807a;font-size:12px}.stat-value{display:block;margin-top:8px;font-size:26px;font-weight:800}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px 8px;border-bottom:1px solid #edf2ed;text-align:left;vertical-align:top}.table th{color:#71807a;font-weight:500}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e4f1e4;color:#39705b;font-size:11px}.pill.off{background:#f2e7e2;color:#a35d4e}.empty{padding:45px;text-align:center;color:#8b9489}.error{padding:12px;border-radius:9px;background:#fff0eb;color:#a35d4e;font-size:13px;margin-bottom:14px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);padding:28px}.login h1{margin:0 0 8px}.login label{display:block;margin-top:16px;color:#527059;font-size:13px}.login input{width:100%;margin-top:7px;padding:11px;border:1px solid #dce7dc;border-radius:9px}.login .btn{width:100%;margin-top:20px}.detail{margin-top:16px;padding:16px;border-radius:12px;background:#f4f8f2;white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:420px;overflow:auto}@media(max-width:760px){.shell{padding:14px}.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.cards{grid-template-columns:1fr 1fr}.panel-head{align-items:flex-start;flex-direction:column}.search{width:100%}.table{min-width:650px}.panel{overflow:auto}}
</style>
</head>
<body><div id="app"></div>
<script>
const DEFAULT_API='https://ziyoukedu-d0gyrczqk4de53b87-1311439378.ap-shanghai.app.tcloudbase.com/api';
const app=document.getElementById('app');
const state={token:localStorage.getItem('fire_admin_token')||'',base:localStorage.getItem('fire_admin_api')||DEFAULT_API,tab:'overview',loading:false,error:'',overview:null,users:[],posts:[],chats:[],selected:null};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function request(path,options={}){
 const headers={'Accept':'application/json','Content-Type':'application/json',...(options.headers||{})};
 if(state.token)headers.Authorization='Bearer '+state.token;
 const res=await fetch(state.base.replace(/\/$/,'')+path,{...options,headers});
 const raw=await res.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{data={message:raw}}
 if(!res.ok)throw new Error(data.message||data.error||'管理接口请求失败（'+res.status+'）');
 return data;
}
function render(){if(!state.token){app.innerHTML=loginView();return}app.innerHTML=adminView();loadTab()}
function loginView(){return '<div class="login-wrap"><form class="login" id="login"><h1>Fire生活后台</h1><p class="muted">简洁管理用户、会员、社区和 AI 数据 · 仅需管理员密码</p><label>管理 API 地址<input id="base" value="'+esc(state.base)+'"></label><label>管理员密码<input id="token" type="password" placeholder="输入云函数环境变量 ADMIN_TOKEN"></label><button class="btn" type="submit">进入后台</button><p class="muted">密码只在云函数环境变量中保存，网页不会保存或暴露密码。</p></form></div>'}
function adminView(){return '<div class="shell"><header class="top"><div><div class="brand">Fire生活后台</div><div class="muted">只保留必要的管理操作</div></div><div class="top-actions"><button class="btn light" id="refresh">刷新</button><button class="btn danger" id="logout">退出</button></div></header><div class="layout"><nav class="nav"><button data-tab="overview">总览</button><button data-tab="users">用户与会员</button><button data-tab="community">社区经历</button><button data-tab="chats">AI 聊天</button></nav><main id="content"></main></div></div>'}
function setContent(html){document.getElementById('content').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}
async function loadTab(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;loadTab()});document.getElementById('refresh').onclick=()=>loadTab();document.getElementById('logout').onclick=()=>{localStorage.removeItem('fire_admin_token');state.token='';render()};try{state.error='';if(state.tab==='overview')await loadOverview();if(state.tab==='users')await loadUsers();if(state.tab==='community')await loadPosts();if(state.tab==='chats')await loadChats()}catch(e){state.error=e.message;setContent('<div class="panel"><div class="error">'+esc(e.message)+'</div><p class="muted">请确认后端已部署管理员接口，并且当前令牌有管理员权限。</p></div>')}}
async function loadOverview(){const d=await request('/v1/admin/overview');state.overview=d;setContent('<section class="panel"><div class="panel-head"><div class="panel-title">数据总览</div><span class="muted">实时读取</span></div><div class="cards">'+[['用户',d.users],['会员',d.members],['社区经历',d.communityPosts],['AI 对话',d.aiChats]].map(x=>'<div class="stat"><span class="stat-label">'+x[0]+'</span><span class="stat-value">'+esc(x[1]??0)+'</span></div>').join('')+'</div></section>')}
async function loadUsers(){const d=await request('/v1/admin/users');state.users=Array.isArray(d)?d:(d.items||[]);setContent('<section class="panel"><div class="panel-head"><div class="panel-title">用户与会员</div><input class="search" id="userSearch" placeholder="搜索邮箱或用户 ID"></div><div id="userTable"></div></section>');renderUsers();document.getElementById('userSearch').oninput=renderUsers}
function renderUsers(){const q=(document.getElementById('userSearch')?.value||'').toLowerCase();const list=state.users.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('userTable').innerHTML=list.length?'<table class="table"><tr><th>用户</th><th>邮箱</th><th>会员</th><th>更新时间</th><th></th></tr>'+list.map(x=>'<tr><td>'+esc(x.id||x.userId||x._id)+'</td><td>'+esc(x.email||x.profile?.email||'—')+'</td><td><span class="pill '+(x.membership?.active?'':'off')+'">'+(x.membership?.active?'已开通':'未开通')+'</span></td><td>'+esc(x.updatedAt||x.updated_at||'—')+'</td><td><button class="btn light" data-user="'+esc(x.id||x.userId||x._id)+'">查看</button></td></tr>').join('')+'</table>':'<div class="empty">没有用户数据</div>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{const x=state.users.find(v=>String(v.id||v.userId||v._id)===b.dataset.user);document.getElementById('userTable').insertAdjacentHTML('beforeend','<div class="detail">'+esc(JSON.stringify(x,null,2))+'</div>')})}
async function loadPosts(){const d=await request('/v1/admin/community/posts');state.posts=Array.isArray(d)?d:(d.items||[]);setContent('<section class="panel"><div class="panel-head"><div class="panel-title">社区经历</div><input class="search" id="postSearch" placeholder="搜索标题或用户"></div><div id="postTable"></div></section>');renderPosts();document.getElementById('postSearch').oninput=renderPosts}
function renderPosts(){const q=(document.getElementById('postSearch')?.value||'').toLowerCase();const list=state.posts.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('postTable').innerHTML=list.length?'<table class="table"><tr><th>标题</th><th>作者</th><th>状态</th><th>时间</th><th></th></tr>'+list.map(x=>'<tr><td>'+esc(x.title||'—')+'</td><td>'+esc(x.displayName||x.userId||'—')+'</td><td><span class="pill">'+esc(x.status||'approved')+'</span></td><td>'+esc(x.createdAt||'—')+'</td><td><button class="btn danger" data-delete="'+esc(x.id)+'">删除</button></td></tr>').join('')+'</table>':'<div class="empty">没有社区内容</div>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条经历？'))return;await request('/v1/admin/community/posts/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});loadPosts()})}
async function loadChats(){const d=await request('/v1/admin/ai/chats');state.chats=Array.isArray(d)?d:(d.items||[]);setContent('<section class="panel"><div class="panel-head"><div class="panel-title">AI 聊天记录</div><input class="search" id="chatSearch" placeholder="搜索用户或内容"></div><div id="chatTable"></div></section>');renderChats();document.getElementById('chatSearch').oninput=renderChats}
function renderChats(){const q=(document.getElementById('chatSearch')?.value||'').toLowerCase();const list=state.chats.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('chatTable').innerHTML=list.length?'<table class="table"><tr><th>用户</th><th>标题</th><th>消息数</th><th>更新时间</th></tr>'+list.map(x=>'<tr><td>'+esc(x.userId||'—')+'</td><td>'+esc(x.title||'新对话')+'</td><td>'+esc((x.messages||[]).length)+'</td><td>'+esc(x.updatedAt||'—')+'</td></tr>').join('')+'</table>':'<div class="empty">没有聊天记录</div>'}
document.addEventListener('submit',async e=>{if(e.target.id==='login'){e.preventDefault();state.base=document.getElementById('base').value.trim();state.token=document.getElementById('token').value.trim();if(!state.token)return alert('请输入管理员令牌');const submit=e.target.querySelector('button');submit.disabled=true;submit.textContent='验证中…';try{await request('/v1/admin/overview');localStorage.setItem('fire_admin_api',state.base);localStorage.setItem('fire_admin_token',state.token);render()}catch(error){state.token='';alert('管理员密码或接口地址错误：'+error.message)}finally{submit.disabled=false;submit.textContent='进入后台'}}})
render();
</script></body></html>
