@keyframes elastic-tab-indicator{0%{left:var(--elastic-from-left);width:var(--elastic-from-width)}28%{left:var(--elastic-left);width:var(--elastic-from-width)}52%{left:calc(var(--elastic-left) - var(--elastic-width) * .12);width:calc(var(--elastic-width) * 1.38)}72%{left:calc(var(--elastic-left) - var(--elastic-width) * .05);width:calc(var(--elastic-width) * 1.14)}88%{left:var(--elastic-left);width:calc(var(--elastic-width) * 1.025)}100%{left:var(--elastic-left);width:var(--elastic-width)}}

/* Approved mobile design: landscape masthead and four primary destinations. */
:root{
  --bg:#fdfdfb;
  --ink:#243830;
  --muted:#52605a;
  --line:#e5e9e0;
  --teal:#527059;
  --mint:#e8efe4;
  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:16px;
  --radius-xl:24px;
  --font-h1:32px;
  --font-h2:24px;
  --font-h3:20px;
  --font-h4:16px;
  --font-body:14px;
  --font-caption:12px;
  --color-expense:#8a4f16;
  --color-expense-bg:#fff3df;
  --color-income:#25613f;
  --color-income-bg:#e3f2e7;
  --color-neutral:#52605a;

<script id="engines">/* FIRE Engine is the only source of computed freedom dates. Financial assumptions are explicit in UI. */
function addCalendarMonths(start,months){
 const date=new Date(start),day=date.getDate();date.setDate(1);date.setMonth(date.getMonth()+months);
 const lastDay=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();date.setDate(Math.min(day,lastDay));return date;
}
function SavingsProjection(assets,target,deposit,annualRate){
 const rate=Math.pow(1+annualRate/100,1/12)-1;let value=assets,months=0;
 while(value+1e-7<target&&months<1200){value=value*(1+rate)+deposit;months++;}
 const reached=value+1e-7>=target;
 return {target,months:reached?months:null,years:reached?(months/12).toFixed(1):null,progress:Math.min(100,Math.max(0,assets/target*100)),date:reached?addCalendarMonths(new Date(),months):null,monthlySaving:deposit};
}
function FireEngine(f){
 const retirementExpense=Number.isFinite(f.retirementExpense)?f.retirementExpense:f.expense;
 const deposit=Number.isFinite(f.monthlyDeposit)?f.monthlyDeposit:Math.max(0,f.income-f.expense);
 return SavingsProjection(f.assets,retirementExpense*12/(f.withdrawal/100),deposit,f.rate);
}
function GoalEngine(g){
 const r=SavingsProjection(g.assets,g.amount,g.monthlyDeposit,g.rate),n=g.expectedMonths,rate=Math.pow(1+g.rate/100,1/12)-1;
 const growth=Math.pow(1+rate,n),factor=Math.abs(rate)<1e-12?n:Math.expm1(n*Math.log1p(rate))/rate;
 const requiredMonthly=r.months===0?0:Math.max(0,(g.amount-g.assets*growth)/factor),projectedAtExpected=g.assets*growth+g.monthlyDeposit*factor;
 return {...r,requiredMonthly,projectedAtExpected,shortfall:r.months===0?0:Math.max(0,g.amount-projectedAtExpected),onTime:r.months!==null&&r.months<=n};
}
function ActionEngine(s,action,id){
 const item=s.items.find(i=>i.id===id);
 if(action==='abandon'&&item&&item.status==='active'){item.status='abandoned';return true;}
 if(action==='buy'&&item&&item.status==='active'){item.status='bought';return true;}
 if(action==='task'&&!s.completed.includes(id)){const reward={assets:50,savings:80,wishlist:50,read:30}[id];if(!reward)return false;s.exp+=reward;s.completed.push(id);return true;}
 return false;
}

/* Two persistent task slots rotate only after completion, on the next local day. */
const HERO_POOL=['assets','wishlist','savings','read'];
// 阅读是核心成长任务，拔草保留但降低出现概率。
const HERO_WEIGHTS={assets:2,wishlist:1,savings:2,read:6};
function LocalDay(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function weightedHeroTask(exclude,current){
 const candidates=HERO_POOL.filter(id=>id!==exclude&&id!==current);
 const pool=candidates.length?candidates:HERO_POOL.filter(id=>id!==exclude);
 const total=pool.reduce((sum,id)=>sum+(HERO_WEIGHTS[id]||1),0);
 let pick=Math.random()*total;
 for(const id of pool){pick-=HERO_WEIGHTS[id]||1;if(pick<0)return id;}
 return pool[pool.length-1];
}
function HeroDay(s,day=LocalDay()){
 if(!s.hero||s.hero.version!==1||!Array.isArray(s.hero.slots)||s.hero.slots.length!==2||s.hero.slots.some(x=>!HERO_POOL.includes(x.id))||s.hero.slots[0].id===s.hero.slots[1].id){
  s.hero={version:1,day,slots:[{id:'assets',done:false},{id:'read',done:false}],ledgerDone:false,log:[],actionDays:[],totalCompleted:0};return true;
 }
 const h=s.hero;if(day<=h.day)return false;
 // 仅在任务完成后的下一天轮换；阅读高权重，拔草低权重，且不与另一任务重复。
 h.slots.forEach((slot,index)=>{if(slot.done){const other=h.slots[1-index].id;slot.id=weightedHeroTask(other,slot.id);slot.done=false;}});
 h.day=day;h.ledgerDone=false;return true;
}
function HeroComplete(s,id,day=LocalDay()){
 HeroDay(s,day);const h=s.hero;if(day!==h.day)return false;
 if(id==='ledger'){if(h.ledgerDone)return false;h.ledgerDone=true;}
 else {const slot=h.slots.find(x=>x.id===id);if(!slot||slot.done)return false;slot.done=true;}
 s.exp+=10;h.totalCompleted++;if(!h.actionDays.includes(day))h.actionDays.push(day);
 h.log.push({id,day,reward:10});if(h.log.length>200)h.log.shift();return true;
}
const EXPENSE_CATEGORIES={food:'餐饮',shopping:'购物',life:'日常生活',travel:'交通旅行',groceries:'蔬菜',fruit:'水果',snack:'零食',sport:'运动',fun:'娱乐',phone:'通讯',clothes:'服饰',beauty:'护理',housing:'住房',home:'居家',children:'孩子',family:'家人',social:'社交',holiday:'旅行',digital:'数码',car:'汽车',medical:'医疗',books:'书籍',learning:'学习',pets:'宠物',gifts:'礼物',work:'办公',repair:'维修',donation:'公益',other:'其他'};
function SaveExpense(s,entry,day=LocalDay()){
 const raw=String(entry.amount??'').trim();if(!/^\d+(\.\d{1,2})?$/.test(raw))return false;
 const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0||amount>100000000)return false;
 const date=String(entry.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>day)return false;
 const parsed=new Date(date+'T12:00:00');if(!Number.isFinite(parsed.getTime())||LocalDay(parsed)!==date)return false;
 const type=entry.type||'expense',old=entry.id?(s.ledger||[]).find(x=>x.id===entry.id):null,category=LedgerCategories(s,type,true).find(x=>x.id===entry.category);if(!['expense','income'].includes(type)||!category||(!category.enabled&&!(old&&old.category===entry.category&&(old.type||'expense')===type)))return false;
 const note=String(entry.note||'').trim();if(note.length>120)return false;
 if(!Array.isArray(s.ledger))s.ledger=[];
 const necessity=type==='expense'?(entry.necessity===undefined?(old?.necessity??null):entry.necessity):null;if(necessity!==null&&!['necessary','comfort','impulse'].includes(necessity))return false;
 const record={id:entry.id||'expense-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),cents:Math.round(amount*100),category:entry.category,type,date,note,necessity};
 if(entry.id){const index=s.ledger.findIndex(x=>x.id===entry.id);if(index<0)return false;s.ledger[index]=record;}else s.ledger.push(record);
 HeroDay(s,day);if(type==='expense'&&date===day)HeroComplete(s,'ledger',day);return true;
}

function DeleteExpense(s,id){if(!Array.isArray(s.ledger))return false;const index=s.ledger.findIndex(x=>x.id===id);if(index<0)return false;s.ledger.splice(index,1);return true;}

/* Asset snapshots are totals, never deposits or ledger deductions. */
function ValidRecordDay(date,day=LocalDay()){
 if(typeof date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>day)return false;
 const parsed=new Date(date+'T12:00:00');return Number.isFinite(parsed.getTime())&&LocalDay(parsed)===date;
}
function OrderedAssets(s){return [...(s.assetHistory||[])].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);}
function SyncLatestAsset(s){const latest=OrderedAssets(s).at(-1);if(latest){if(s.finance.assets!==latest.amount)delete s.freedomPlan;s.finance.assets=latest.amount;}}
function SaveAssetRecord(s,entry,day=LocalDay()){
 const raw=String(entry.amount??'').trim(),amount=Number(raw),date=String(entry.date||'');
 if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isFinite(amount)||amount<0||amount>1e9||!ValidRecordDay(date,day))return null;
 if(!Array.isArray(s.assetHistory))s.assetHistory=[];
 const index=entry.id?s.assetHistory.findIndex(x=>x.id===entry.id):-1;
 if(entry.id&&index<0)return null;
 // One explicit action produces at most one snapshot for a date. Repeating the same
 // save is a no-op, while correcting today's amount updates that day's record.
 const sameDateIndex=index>=0?index:s.assetHistory.findIndex(x=>x.date===date);
 const current=sameDateIndex>=0?s.assetHistory[sameDateIndex]:null;
 const normalized=Math.round(amount*100)/100;
 if(current&&current.amount===normalized){SyncLatestAsset(s);return {changed:false,record:current};}
 const createdAt=current?.createdAt??Math.max(Date.now(),...s.assetHistory.map(x=>x.createdAt+1));
 const record={id:current?.id||entry.id||'asset-'+createdAt+'-'+Math.random().toString(36).slice(2,8),date,amount:normalized,createdAt};
 if(sameDateIndex>=0)s.assetHistory[sameDateIndex]=record;else s.assetHistory.push(record);

function DeleteAssetRecord(s,id){const index=(s.assetHistory||[]).findIndex(x=>x.id===id);if(index<0)return false;s.assetHistory.splice(index,1);SyncLatestAsset(s);return true;}

function quickExpensePanel(editing){return `<form id="expense-form" class="expense-entry-panel${expensePanelEntry?' panel-enter':''}${expenseKeyboardCollapsed?' keyboard-collapsed':''}"><div class="expense-panel-head"><span>${expenseCategoryIcon(LedgerCategories(state,expenseDraft.type,true).find(x=>x.id===expenseDraft.category)?.icon||'other')} ${escapeText(LedgerCategories(state,expenseDraft.type,true).find(x=>x.id===expenseDraft.category)?.label||'其他')}</span><label><input id="expenseAmount" name="expenseAmount" type="text" inputmode="decimal" value="${escapeText(expenseDraft.amount)}" placeholder="0.00" readonly aria-label="金额，请使用下方数字键盘"><small>元</small></label><button type="button" class="expense-keyboard-toggle" data-action="expense-keyboard-toggle" aria-expanded="${!expenseKeyboardCollapsed}">${expenseKeyboardCollapsed?'展开键盘⌄':'收起键盘⌃'}</button></div><input type="hidden" name="expenseType" value="${expenseDraft.type}"><input type="hidden" name="expenseCategory" value="${expenseDraft.category}">${expenseDraft.type==='expense'?necessityPicker():''}<div class="expense-entry-meta"><input id="expenseNote" name="expenseNote" value="${escapeText(expenseDraft.note)}" placeholder="添加备注（选填）" maxlength="120" aria-label="备注"><input id="expenseDate" name="expenseDate" type="date" value="${expenseDraft.date}" max="${LocalDay()}" required aria-label="记账日期"></div><div class="error" id="form-error" role="alert"></div><div class="expense-keypad">${['7','8','9','4','5','6','1','2','3','.','0'].map(k=>`<button type="button" data-action="expense-key" data-id="${k}">${k}</button>`).join('')}<button type="button" class="expense-key-delete" data-action="expense-key" data-id="delete" aria-label="删除最后一位">⌫</button><button type="button" class="expense-key-clear" data-action="expense-clear">清空</button><button type="submit" class="expense-key-done">${editing?'保存':'完成'}</button></div></form>`;}

function dismissWishlistDelete(){pendingWishlistDeleteId=null;const dialog=document.querySelector('#wishlist-delete-dialog');if(dialog&&typeof dialog.close==='function'){dialog.close();dialog.remove();}else render();}
document.addEventListener('cancel',e=>{if(e.target.id==='wishlist-delete-dialog'){e.preventDefault();dismissWishlistDelete();}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&page==='home'&&!HomeOnboardingSeen()){FinishHomeOnboarding();render();}},true);
function cancelCalculation(){calculationToken++;calculationTimers.forEach(clearTimeout);calculationTimers=[];}
function beginCalculation(destination){cancelCalculation();calculationDestination=destination;if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){go(destination);return;}go('calculating');const token=calculationToken;const stage=(text,index)=>{if(token!==calculationToken||page!=='calculating')return;document.querySelector('#calculation-status').textContent=text;document.querySelector('#calculation-stage-'+index).className='calculation-step is-complete';};calculationTimers=[setTimeout(()=>stage('按当前假设测算',1),350),setTimeout(()=>stage('整理计算结果',2),700),setTimeout(()=>{if(token===calculationToken&&page==='calculating')go(destination,false);},1100)];}
function EmptyState(kind,title,desc,route,actionLabel){const icons={ledger:'<path d="M6 3h12v18H6zM9 7h6M9 11h6M9 15h3"/>',wishlist:'<path d="M12 20S4 15.5 4 9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15.5 12 20 12 20Z"/>',reading:'<path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H20v16H7.5A2.5 2.5 0 0 0 5 21zM5 5.5v15M8 7h8M8 11h7"/>'};return `<div class="empty-state"><div class="empty-state-illustration" aria-hidden="true"><svg viewBox="0 0 24 24">${icons[kind]||icons.ledger}</svg></div><h3>${escapeText(title)}</h3><p>${escapeText(desc)}</p>${route?`<button class="btn" ${route.startsWith('action:')?`data-action="${route.slice(7)}"`:`data-go="${route}"`}>${escapeText(actionLabel||'开始')}</button>`:''}</div>`;}
let homeOnboardingStep=0,homeOnboardingMemory=false;
function HomeOnboardingSeen(){try{return homeOnboardingMemory||localStorage.getItem('fire_home_onboarding_v1')==='done';}catch{return homeOnboardingMemory;}}
function FinishHomeOnboarding(){homeOnboardingMemory=true;try{localStorage.setItem('fire_home_onboarding_v1','done');}catch{}}
function HomeOnboarding(){if(page!=='home'||HomeOnboardingSeen())return '';const steps=[['自由日倒计时','把资产、储蓄和生活开支放在一起，估算你拥有选择权的那一天。','自由日'],['EXP 经验值','完成每日行动就会获得 EXP，在“我的成长”里查看等级和连续行动。','+10'],['从一个行动开始','先填写财务数据，或从今天的一件小事开始，让计划真正动起来。','→']];const [title,body,visual]=steps[homeOnboardingStep];return `<div class="home-onboarding-backdrop" role="dialog" aria-modal="true" aria-labelledby="home-onboarding-title"><section class="home-onboarding"><div class="home-onboarding-step"><b>认识 FIRE</b><span>·</span><span>第 ${homeOnboardingStep+1} / ${steps.length} 步</span></div><div class="home-onboarding-visual" aria-hidden="true"><span>${visual}</span></div><h2 id="home-onboarding-title">${title}</h2><p>${body}</p><div class="home-onboarding-actions"><button class="home-onboarding-skip" data-action="home-onboarding-skip">以后再看</button><button class="home-onboarding-next" data-action="home-onboarding-next">${homeOnboardingStep===steps.length-1?'开始体验':'下一步'}</button></div></section></div>`;}
function monthlyStatusNote(type,status){return status?`<small class="monthly-status ${type==='expense'||status==='未达标'?'warning':'success'}" data-status="${escapeText(status)}">${escapeText(status)}</small>`:'';}
function homeMonthlyMetrics(){const stats=MonthlyStatus(state);return `<div class="home-metrics">${[['expense','本月消费'],['income','本月收入']].map(([type,label])=>`<button class="home-ledger-metric home-ledger-${type}" data-action="home-ledger" data-id="${type}" aria-label="${label}，查看记账${stats[type].target===null?'并设置'+(type==='expense'?'预算':'目标'):''}"><span class="home-metric-label"><span class="sub">${label} <span aria-hidden="true">›</span></span></span><strong class="num">¥ ${amountText(stats[type].total/100)}</strong><span class="home-metric-feedback">${stats[type].target===null?`<small class="monthly-setup">${type==='expense'?'设置预算':'设置目标'} ›</small>`:monthlyStatusNote(type,stats[type].status)}</span></button>`).join('')}<div class="home-saved-metric"><span class="home-metric-label"><span class="sub">拔草已省下</span></span><strong id="wishlist-saved-total" class="num">¥ ${amountText(WishlistSaved(state))}</strong><span class="home-metric-feedback" aria-hidden="true"></span></div></div>`;}

function CategoryAnimationRank(index,total){const columns=4,row=Math.floor(index/columns),start=row*columns,end=Math.min(total,start+columns),rowIndexes=Array.from({length:end-start},(_,i)=>start+i).reverse();if(row>0&&rowIndexes.length>2)[rowIndexes[1],rowIndexes[2]]=[rowIndexes[2],rowIndexes[1]];return rowIndexes.indexOf(index)+row*columns;}
function MonthlyTargetsReady(month=ledgerMonth){const targets=state.monthlyTargets?.[month]||{};return Number.isSafeInteger(targets.expense)&&targets.expense>0&&Number.isSafeInteger(targets.income)&&targets.income>0;}
function monthlyTargetsPanel(){const targets=state.monthlyTargets?.[ledgerMonth]||{},stats=MonthlyStatus(state,ledgerMonth),value=type=>targets[type]===null||targets[type]===undefined?'':(targets[type]/100).toFixed(2),ready=MonthlyTargetsReady(ledgerMonth);return `<details class="monthly-target-panel" ${ready?'':'open'}><summary>${ready?'修改本月预算':'先填写本月消费与收入预算'}</summary><p class="hint">${ready?'修改预算后，记录会继续保留在上方。':'首次记账前需要同时填写两项预算。保存后才能新增消费或收入。'}</p><form id="monthly-target-form"><div class="form-row"><label for="monthlyBudget">本月消费预算（元）</label><input id="monthlyBudget" name="monthlyBudget" type="text" inputmode="decimal" value="${value('expense')}" placeholder="例如 3000" maxlength="12"></div><div class="form-row"><label for="monthlyIncome">本月收入预算（元）</label><input id="monthlyIncome" name="monthlyIncome" type="text" inputmode="decimal" value="${value('income')}" placeholder="例如 10000" maxlength="12"></div><div class="error" id="monthly-target-error" role="alert"></div><button type="submit" class="btn light">保存本月预算</button></form></details><div class="monthly-target-summary"><span>消费预算 ${targets.expense===null||targets.expense===undefined?'未设置':amountText(targets.expense/100)+' 元'}${monthlyStatusNote('expense',stats.expense.status)}</span><span>收入预算 ${targets.income>0?amountText(targets.income/100)+' 元':'未设置'}${monthlyStatusNote('income',stats.income.status)}</span></div>`;}
function unconfiguredHome(){return `<section class="home-masthead" style="--landscape:url('${LANDSCAPE}')"><header class="masthead-title"><h1>我的自由计划</h1><p>${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</p>${themeToggleButton()}</header><div class="home-unconfigured"><span class="freedom-label">从了解自己开始</span><h2>先填写你的财务数据</h2><p class="sub">填写资产、每月存入和退休后消费，<br>就能看到你的自由日与计划进度。</p><button class="btn" data-go="calculator">填写财务数据</button></div></section><div class="home-content">${homeMonthlyMetrics()}${goalCard()}<section class="section"><div class="section-head"><h2>今日行动</h2><button data-go="hero">${todayCount()} / 3</button></div>${todayTasks().map(completedRow).join('')}</section>${HomeOnboarding()}</div>`;}
function assetTrend(records){
 if(records.length<2)return '<div class="trend-empty"><p class="sub">记录两次资产后，这里会出现趋势。</p></div>';
 const points=records.slice(-60),amounts=points.map(x=>x.amount),low=Math.min(...amounts),high=Math.max(...amounts),range=high-low||1;
 const dots=points.map((x,i)=>({x:12+i/(points.length-1)*296,y:105-(x.amount-low)/range*85,record:x})),path=dots.map(d=>d.x+','+d.y).join(' ');
 return `<div class="asset-trend"><svg viewBox="0 0 320 125" role="img" aria-label="最近 ${points.length} 条资产记录趋势，起点 ${amountText(points[0].amount)} 元，终点 ${amountText(points.at(-1).amount)} 元"><path d="M12 105H308" stroke="#dbe3d8" fill="none"/><polyline points="${path}" fill="none" stroke="#648575" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots.map(d=>`<circle cx="${d.x}" cy="${d.y}" r="3" fill="#648575"><title>${d.record.date}：${d.record.amount} 元</title></circle>`).join('')}</svg><div class="row sub"><span>${points[0].date}</span><span>${points.at(-1).date}</span></div><p class="hint">最近 ${points.length} 条 · 最低 ${amountText(low)} 元 · 最高 ${amountText(high)} 元</p></div>`;
}
