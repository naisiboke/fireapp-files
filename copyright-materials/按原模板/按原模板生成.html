"从今日行动中的资产记录或相关工具入口进入资产页面。填写当前可投资资产金额，并核对记录日期，点击“保存并返回首页”。","保存成功后，最近记录列表保留对应金额和日期，首页读取最新资产记录。记录较早日期时，历史数据不会替代日期较新的资产余额。"],"items":["操作1：填写资产金额。","操作2：通过日期选择器核对记录日期。","操作3：点击“保存并返回首页”。"]},{"title":"7、极简拔草与到期确认","pic":"wishlist","mandatory":true,"caption":"极简拔草三栏和项目操作入口","paras":["极简拔草用于记录想买的物品，并为消费决定保留冷静时间。点击“添加”，填写名称、预计金额、分类和3、7或30天冷静期，确认后保存。","列表仅分为“进行中”“挑战成功”“已购买”三栏。点击项目进入详情，查看预计金额、创建日期、冷静期和剩余时间。","冷静期到达后，由用户选择“没买，挑战成功”“买了，记录购买”或“稍后再说”；每项支持删除，删除前提示不可恢复。"],"items":["进行中：仍在等待冷静期或最终消费决定。","挑战成功：已确认不购买，包括提前结束和到期未购买。","已购买：已确认购买，本次挑战失败。"]},{"title":"8、人格测评与我的性格","pic":"personality","mandatory":true,"caption":"人格测试入口或本人测试结果","paras":["从工具页进入“人格测试”，可选择大五人格50题或MBTI100题。根据自己的日常表现选择答案，按页面顺序完成测试。","完成后查看维度或偏好结果，结果保存在“我的性格”，便于再次查看，并为应用内结合个人情况的行为建议提供参考。"],"items":["答题前确认测试类型。","按真实日常情况作答，避免为获得某种结果而选择答案。","完成后核对结果是否保存在本人账户。"]},{"title":"9、行为建议对话","pic":"ai","mandatory":true,"caption":"问AI聊天区域、输入框和发送按钮","paras":["进入“问 AI”后，系统检查财务资料和至少一项人格测试是否完成。资料不足时，通过页面按钮先补充资产报告或完成测试。","满足条件后，在输入框填写关于消费习惯、储蓄安排、生活节奏或目标行动的问题，点击“发送”。也可使用“建议”入口，结合当前个人资料发起建议请求。"],"items":["建议只作为生活与行为规划参考，不提供投资建议或收益保证。","无需把完整人格报告手动复制到聊天框。","避免在问题中输入密码、验证码、证件号码或无关他人隐私。"]},{"title":"10、社区分享与收藏","pic":"community","mandatory":false,"caption":"社区内容、收藏或发帖操作入口","paras":["社区用于浏览自由生活相关经历。点击内容可查看详细经历与时间线，对希望稍后阅读的帖子进行收藏，并在收藏列表查看。","具有相应权限时，可进入“分享我的经历”，选择标签和当前状态，填写主题、简介及时间点。可先保存草稿，确认内容完整后提交审核。"],"items":["收藏自己的帖子不获得收藏奖励。","同一篇合格帖子仅奖励一次，取消收藏后再收藏不会重复奖励。","收藏任务每天最多奖励3篇不同帖子，每篇2经验。"]},{"title":"11、今日行动与设置","pic":"settings","mandatory":false,"caption":"任务成长状态或设置中的更新、隐私入口","paras":["今日行动最多展示3项当前可执行任务，完成状态和经验以云端确认的回执更新。可在成长页面查看累计经验、等级及规则。","记账5经验，每日1次；资产8经验，每月最多2次且间隔至少14天；有目标时保存或检视目标8经验，每自然周1次；收藏2经验，每篇终身1次、每日最多3篇；审核通过发帖10经验，每90天1次；合格编辑8经验，每60天1次。"],"items":["出现“经验待同步”时，记录可能已保存；联网后点击重试，不需要重复建立相同记录。","未满足奖励周期时，操作仍可保存，但不会再次发经验。","点击“检查更新”，发现已发布新版后，可选择前往官网下载。"]},{"title":"12、数据同步与更新","paras":["本机已保存与云端已同步是不同状态。网络中断时，已经成功写入本机的内容保留；恢复网络后按页面提示重试同步，并确认当前登录账户。","登录状态失效时，按提示用原邮箱重新验证。不要使用新账户代替原账户恢复资料，也不要为处理同步异常而直接清空本机记录。","在设置中点击“检查更新”。发现已发布的新版本时，点击“立即更新”前往官方网站 fireday.cn，下载正式安装包并按系统提示安装。"],"items":["维护建议：定期核对实际资产、收支和目标进度。","更新建议：使用官方正式安装包，覆盖升级时保留一致的包名与签名。","遇到无法确认的情况，先保留现有记录，再通过设置中的反馈入口联系支持。"]}],"purpose":"帮助个人记录收支与资产，管理消费冷静期和储蓄目标，结合行为资料获得生活规划参考。","features":"本软件面向个人财务记录与生活规划，提供邮箱验证码登录及账户资料管理。用户可记录收入、支出、分类、金额、日期和备注，查看月度收支汇总；填写资产金额与记录日期，保存历史资产并更新首页数据。自由日工具根据当前资产、每月存入、退休后消费及收益假设测算预计日期、剩余时间和进度。目标储蓄模式支持填写目标名称、目标金额、已准备金额与计划期限，将目标倒计时发布到首页，并允许删除目标。极简拔草支持建立消费计划、设置冷静期、查看进行中项目、提前结束、记录购买及删除项目；到期后询问是否购买，将确认结果归入挑战成功或已购买。人格测评支持完成答题并查看个人结果；行为建议对话结合财务资料与测评结果提供消费习惯、储蓄安排和目标行动参考，并保留对话历史。社区支持浏览经历、收藏内容、编辑草稿、投稿审核及管理本人帖子。今日行动根据有效记账、资产记录、目标保存和社区操作确认完成状态，并按周期规则累计经验。设置提供隐私选项、数据导出、账户注销申请、同步状态和更新检查；发现已发布新版后引导用户前往官网下载。各账户资料分开保存，网络异常时保留已成功保存的本机记录并提供重试提示。测算结果用于生活规划参考，不提供投资建议或收益承诺。","tech":"采用组件化页面、独立的计算模块、账户隔离存储及云端回执校验，支持同步重试、任务去重和跨页面资料联动。","provenance":{"commit":"14b89b584e0dddce6bac65a3e1b17c4b634f07f2","nonblankBusinessLines":5039,"selectedLines":3000,"pages":60,"linesPerPage":50,"sourceFiles":[{"path":"绿岛/main.js","nonblankLines":53,"longLines":0,"sha":"8cf51556e1184a7ca3acfcecb5070798a5c24ad3"},{"path":"绿岛/store/index.js","nonblankLines":925,"longLines":2,"sha":"99ba3a896a7b5f078e2f2c2353ef58658e957e8f"},{"path":"绿岛/utils/engine.js","nonblankLines":589,"longLines":0,"sha":"c3c4ff15bb7073532ca7b1f1225041884a1d85f3"},{"path":"绿岛/utils/finance-plan.js","nonblankLines":103,"longLines":0,"sha":"c8834d6820faf1987e3402335ef9df3dcdc93c34"},{"path":"绿岛/utils/asset-action.js","nonblankLines":42,"longLines":0,"sha":"b4202dd997c10dde37db6c796640c82e4d457988"},{"path":"绿岛/utils/wishlist.js","nonblankLines":82,"longLines":0,"sha":"4af3bcba5ac0873cd42493da44f2e73255d2e665"},{"path":"绿岛/utils/account-cache.js","nonblankLines":74,"longLines":0,"sha":"140857e1381b8505e7506205bc9f8b154f3373ef"},{"path":"绿岛/utils/action-tasks.js","nonblankLines":80,"longLines":0,"sha":"90ec6c09cc268b7f6b4bbd5112d131345a4fcf15"},{"path":"绿岛/utils/ai-chat-store.js","nonblankLines":55,"longLines":0,"sha":"cbd0c881d080184201ad1cae2ee8536d9e1db721"},{"path":"绿岛/utils/api function buildDocuments(data,input={},shots={}){
 const meta={name:input.name||data.name,version:input.version||data.version,owner:input.owner||'【著作权人待填】'}
 const required=data.manual.filter(p=>p.mandatory),missing=required.filter(p=>!shots[p.pic]),status=missing.length?'待补截图稿：缺少 '+missing.length+' 张主要界面截图，请勿直接提交。':'提交候选稿：请申请人复核事实、图片和实际分页后使用。'
 const replace=text=>String(text).replaceAll('{{NAME}}',meta.name).replaceAll('{{VERSION}}',meta.version).replaceAll('{{OWNER}}',meta.owner).replaceAll('{{STATUS}}',status)
 let codeBody=''
 data.source.forEach((line,i)=>{codeBody+=paragraph(line,'Code',i>0&&i%50===0)})
 const code=wordPackage(codeBody,meta,'源程序鉴别材料',60)
 let manualBody='',figure=0,imageFiles={}
 data.manual.forEach((page,index)=>{
  manualBody+=paragraph(page.cover?meta.name+' '+meta.version:page.title,page.cover?'Title':'Heading1',index>0)
  if(page.cover)manualBody+=paragraph('用户使用说明书','Title')
  for(const text of page.paras||[])manualBody+=paragraph(replace(text),page.cover?'Normal':'Normal')
  for(const text of page.items||[])manualBody+=paragraph('• '+replace(text))
  if(page.pic&&shots[page.pic]){figure++;imageFiles[figure]=shots[page.pic];manualBody+=picture(figure,shots[page.pic].width,shots[page.pic].height,page.caption)+paragraph('图'+figure+' '+page.caption,'Caption')}
  else if(page.mandatory)manualBody+=placeholder(page.caption)
 })
 const manual=wordPackage(manualBody,meta,'使用说明书',15,imageFiles)
 let body=paragraph(meta.name+' '+meta.version,'Title')+paragraph('功能说明及申请信息参考','Title')+paragraph('本稿依据现有软件功能与源码整理。标记“待确认”的字段不能直接作为确定事实提交。')
 body+=table(data.functions.fields.slice(0,9).map(([a,b])=>[a,replace(b)]))
 body+=paragraph('2 开发、运行与发表信息','Heading1',true)
 const custom={'开发完成日期':input.completedAt,'发表情况':input.publication,'首次发表日期和地点':[input.publishedAt,input.publishedPlace].filter(Boolean).join('，'),'硬件环境':input.hardware}
 body+=table(data.functions.fields.slice(9).map(([a,b])=>[a,custom[a]||replace(b)]))
 body+=paragraph('源程序量应以完整工程实际统计为准，交存材料的3000行不等于软件完整源代码总量。','Small')
 body+=paragraph('3 功能模块说明','Heading1',true)
 for(const [title,text]of data.functions.modules)body+=paragraph(title,'Heading2')+paragraph(text)
 body+=paragraph('4 材料核对与提交说明','Heading1',true)
 for(const text of [
 '名称、简称、版本号和著作权人应在申请表、功能说明、说明书及源程序页眉页脚中保持一致。',
 '本次说明书按15页结构排版，主要界面需至少8张同一正式版本的真实完整截图。缺图稿不作为提交定稿。',
 '当前软件包含个人记录、测算和生活建议，不将尚未接入的支付、没有内容的阅读库或不存在的登录方式写成已完成功能。',
 '开发完成日期、是否发表、首次发表日期和地点、开发方式及硬件环境必须按真实情况补齐。',
 '个人登记与经营主体资质是不同事项，后续运营、授权或转让按实际权利归属及相关平台要求办理。',
 '正式提交前使用文档软件打开文件，核对源码60页、说明书13—15页、图片清晰度、完整性及按钮文字，并检查导出的PDF。',
 '源码编排只做格式整理，不添加无关代码、空白或重复内容凑行数；以所附文件顺序和选段映射追溯源码。',
 '本稿并非对登记通过的承诺，实际表格栏目需与代理提供的模板及受理要求核对。'
 ])body+=paragraph(text)
 const functions=wordPackage(body,meta,'功能说明',4)
 return {code,manual,functions,missing:missing.map(p=>p.pic),meta}
}





function fillCore(parts,meta,pages){
 const p={...parts};
 for(const n of Object.keys(p))if(n.startsWith('customXml/')||n==='docProps/custom.xml')delete p[n];
 for(const n of Object.keys(p)){
  if(n.endsWith('.rels'))p[n]=p[n].replace(/<Relationship\b[^>]*(?:Type="[^"]*\/customXml"|Target="docProps\/custom\.xml")[^>]*\/>/g,'');
  if(n==='[Content_Types].xml')p[n]=p[n].replace(/<Override\b[^>]*PartName="(?:\/customXml\/[^"]*|\/docProps\/custom\.xml)"[^>]*\/>/g,'');
 }
 p['word/settings.xml']=p['word/settings.xml'].replace(/<w:docVars>[\s\S]*?<\/w:docVars>/g,'').replace(/<w:rsids>[\s\S]*?<\/w:rsids>/g,'').replace(/<w:trackRevisions[^>]*\/>/g,'').replace(/<\/w:settings>/,'<w:updateFields w:val="true"/></w:settings>');
 p['docProps/core.xml']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+esc(meta.name+' '+meta.version)+'</dc:title><dc:creator>'+esc(meta.owner)+'</dc:creator><cp:lastModifiedBy>'+esc(meta.owner)+'</cp:lastModifiedBy></cp:coreProperties>';
 p['docProps/app.xml']=p['docProps/app.xml'].replace(/<Pages>[\s\S]*?<\/Pages>/,'<Pages>'+pages+'</Pages>').replace(/<Company>[\s\S]*?<\/Company>/,'<Company/>');
 return p
}
function templateParagraph(text,{style='',page=false,center=false,size=24,after=90,bold=false,line=330}={}){
 return '<w:p><w:pPr>'+(style?'<w:pStyle w:val="'+style+'"/>':'')+(page?'<w:pageBreakBefore/>':'')+'<w:widowControl w:val="0"/><w:spacing w:before="0" w:after="'+after+'" w:line="'+line+'" w:lineRule="exact"/><w:jc w:val="'+(center?'center':'left')+'"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="宋体"/><w:sz w:val="'+size+'"/><w:szCs w:val="'+size+'"/>'+(bold?'<w:b/>':'')+'</w:rPr><w:t xml:space="preserve">'+esc(text)+'</w:t></w:r></w:p>'
}
function templateHeading(text,page=false,level=2){return templateParagraph(text,{style:level===1?'Heading1':'Heading2',page,size:level===1?32:28,bold:true,line:400,after:120})}
function replaceBody(xml,body,sect){return xml.replace(/<w:body>[\s\S]*<\/w:body>/,'<w:body>'+body+sect+'</w:body>')}
function extractSect(xml){return xml.match(/<w:sectPr\b[\s\S]*?<\/w:sectPr>/g).at(-1)}
function templateHeader(original,name,version){
 let x=original.replace(/建筑三维漫游模拟展示系统/g,esc(name)).replace(/V1\.0(?!\.)/g,esc(version));
 x=x.replace(/(<w:fldChar[^>]*w:fldCharType="separate"[^>]*\/>[\s\S]*?<w:t(?:\s[^>]*)?>)\d+(<\/w:t>)/g,'$11$2');
 return x
}
function templateFrame(text){return '<w:p><w:pPr><w:spacing w:before="80" w:after="100" w:line="660" w:lineRule="exact"/><w:pBdr><w:top w:val="single" w:sz="4" w:color="AAAAAA"/><w:bottom w:val="single" w:sz="4" w:color="AAAAAA"/><w:left w:val="single" w:sz="4" w:color="AAAAAA"/><w:right w:val="single" w:sz="4" w:color="AAAAAA"/></w:pBdr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:color w:val="9C5F29"/><w:sz w:val="22"/></w:rPr><w:t>'+esc(text)+'</w:t></w:r></w:p>'}

 p['word/document.xml']=p['word/document.xml'].replace(/<w:tc(?:\s[^>]*)?>[\s\S]*?<\/w:tc>/g,cell=>{

 }).replace(/w:hRule="exact"/g,'w:hRule="atLeast"');
 out.functions={files:p,bytes:zip(p)};

   body+=templateParagraph('更新时使用官网提供的正式安装包；覆盖安装应保持相同包名与签名。发现新版本提示时，点击“立即更新”前往官网下载。');

  }
  if(page.config){

   for(const text of [

const shots={},el=id=>document.getElementById(id);
const required=DATA.manual.filter(p=>p.mandatory);
function update(){const n=required.filter(p=>!shots[p.pic]).length;el('status').textContent=n?'仍缺'+n+'张必需截图；说明书为待补稿，不能直接提交。':'必需截图已选齐；请核实申请事实及Word实际分页。'}
for(const input of document.querySelectorAll('[data-shot]'))input.addEventListener('change',async()=>{
 const key=input.dataset.shot,file=input.files[0];delete shots[key];if(!file){el('info-'+key).textContent='未选择';update();return}
 try{if(!['image/png','image/jpeg'].includes(file.type))throw Error('请选择PNG/JPG图片');if(file.size>20*1024*1024)throw Error('图片请小于20MB');
 const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(Error('读取失败'));r.readAsDataURL(file)});
 const size=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve({width:i.naturalWidth,height:i.naturalHeight});i.onerror=()=>reject(Error('无法识别图片'));i.src=url});
 shots[key]={...size,base64:url.slice(url.indexOf(',')+1),type:file.type};el('info-'+key).textContent=file.name+' '+size.width+'×'+size.height;
 }catch(e){el('info-'+key).textContent=e.message}update()
});
function save(bytes,name,type){const url=URL.createObjectURL(new Blob([bytes],{type:type||'application/octet-stream'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function make(kind){
 try{const input={};for(const id of ['owner','devHardware','runHardware','devOS','runOS','tools','sourceCount'])input[id]=el(id).value.trim();
 if(!input.owner)throw Error('请填写本人准确姓名');const docs=buildTemplateDocuments(DATA,input,shots);
 const names={code:'代码模板_已填写.docx',functions:'功能-填写模板_已填写.docx',manual:'说明书模板_'+(docs.missing.length?'待补截图':'待核对')+'.docx'};
 if(kind==='all'){const files={};for(const key of ['code','functions','manual'])files[names[key]]=docs[key].bytes;files['使用须知.txt']=NOTICE;save(zip(files),'Fire生活_V1.0.5_原模板材料.zip','application/zip')}
 else save(docs[kind].bytes,names[kind],'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
 el('log').textContent='已在本机生成；'+(docs.missing.length?'仍缺'+docs.missing.length+'张必需截图。':'请核对所有待核实项、页数和图片清晰度。')
 }catch(e){el('log').textContent=e.message}
}
for(const id of ['all','code','functions','manual'])el(id).addEventListener('click',()=>make(id));update();
