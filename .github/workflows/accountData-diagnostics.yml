name: AccountData deployment diagnostics
on:
  push:
    branches: [support-accountData-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify complete cloud-function deployment bundle
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('updates/accountData-deploy-20261108.zip') as bundle:
              assert bundle.testzip() is None
              assert set(bundle.namelist()) == {'index.js','service.js','action-rewards.js','recover-legacy.js','package.json','部署说明.txt'}
              for name in bundle.namelist():
                  content = bundle.read(name)
                  assert content.decode('utf-8').strip()
                  target = pathlib.Path('docs/accountData-deployment-help.md' if name == '部署说明.txt' else 'cloudfunctions/accountData/'+name)
                  assert content == target.read_bytes()
          print('Complete accountData root bundle: all six entries and CRC verified')
          PY
      - name: Run existing account and new diagnostic regressions
        working-directory: 绿岛
        run: |
          for script in scripts/check-*.mjs; do node "$script"; done
      - name: Install App dependencies for transport-module compile check
        working-directory: 绿岛
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Build H5 with diagnostic error messages
        working-directory: 绿岛
        run: UNI_INPUT_DIR="$PWD" npm run build:h5
