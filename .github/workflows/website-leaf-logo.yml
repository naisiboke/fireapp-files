name: Review transparent leaf brand and privacy page
on:
  push:
    branches: [website-leaf-logo]
    paths:
      - assets/fireday-leaf.png
      - privacy.html
      - scripts/check-website-brand.cjs
      - download.html
      - index.html
      - scripts/check-website-design.cjs
      - .github/workflows/website-leaf-logo.yml
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify website update archive
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          with zipfile.ZipFile('updates/fireday-leaf-logo-20261108.zip') as bundle:
              assert bundle.testzip() is None
              assert len(bundle.namelist()) == 5
              for name in bundle.namelist():
                  assert not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts
                  content = bundle.read(name)
                  if name.endswith('.png'):
                      assert content.startswith(bytes([137,80,78,71,13,10,26,10]))
                  else:
                      assert content.decode('utf-8').strip(), name
                  if os.environ.get('GITHUB_REF_NAME') == 'website-leaf-logo':
                      target = pathlib.Path('docs/website-leaf-logo-update.md' if name == '使用说明.txt' else name)
                      assert content == target.read_bytes(), name
          print('Website leaf-logo ZIP: PNG binary, CRC and all 5 files verified')
          PY
      - name: Check app update and website download behavior
        run: node 绿岛/scripts/check-website-update.mjs
      - name: Install browser check tools
        run: |
          npm install --prefix /tmp/fireday-web-check --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.56.1 pngjs@7.0.0
          npm exec --prefix /tmp/fireday-web-check -- playwright install --with-deps chromium
      - name: Install Chinese preview fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk > /tmp/fireday-font-install.log 2>&1
      - name: Review desktop, mobile and download behavior
        env:
          FIREDAY_PLAYWRIGHT_PATH: /tmp/fireday-web-check/node_modules/playwright
        run: node scripts/check-website-design.cjs
      - name: Review transparent logo and privacy navigation
        env:
          FIREDAY_PLAYWRIGHT_PATH: /tmp/fireday-web-check/node_modules/playwright
          FIREDAY_PNGJS_PATH: /tmp/fireday-web-check/node_modules/pngjs
        run: node scripts/check-website-brand.cjs
